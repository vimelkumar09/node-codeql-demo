# Docker Compose configuration for CodeQL Demo
# Provides multiple deployment options with reverse proxies

services:
  # Standard Node.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped

  # Node.js app with Nginx reverse proxy
  app-backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3001
    expose:
      - "3001"
    restart: unless-stopped
    profiles:
      - nginx
      - apache

  nginx:
    image: nginx:alpine
    ports:
      - "3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-backend
    restart: unless-stopped
    profiles:
      - nginx

  apache:
    image: httpd:2.4-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./apache.conf:/usr/local/apache2/conf/extra/httpd-vhosts.conf:ro
      - ./apache-httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    depends_on:
      - app-backend
    restart: unless-stopped
    profiles:
      - apache
